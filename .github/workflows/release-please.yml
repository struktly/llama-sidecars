name: Release Please

# Reads conventional commits (feat:/fix:/chore: etc., already required in this
# repo) to decide the release= bump in runtime/llama.version, accumulates them
# into a standing release PR with a generated changelog, and creates the tag +
# GitHub Release itself once that PR is merged (as a draft — see
# release-please-config.json). Merging it never runs "Prepare pinned llama.cpp
# sidecars": that workflow stays workflow_dispatch-only, so a merge here still
# never starts a native build. A human decides when to promote the draft
# release by running that workflow, exactly as before this was added; see
# README.md's release contract.
#
# The token must come from an app/PAT identity, not the default GITHUB_TOKEN:
# GitHub does not let a GITHUB_TOKEN-authenticated action trigger another
# workflow's push/release event (anti-recursion rule), which would mean the
# tag release-please creates would never trigger anything depending on it.
# RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY authenticate as the same
# struktly-bot GitHub App struktly-platform uses (managed via
# struktly-infrastructure/tofu/github-platform) and mint a short-lived
# installation token here, so there is no long-lived PAT to rotate.
#
# Tidebot merges as github-actions[bot], and GitHub does not let a
# GITHUB_TOKEN-authenticated push trigger another workflow's `push` event. A
# Tidebot-merged PR therefore never reached this workflow, and the release PR
# only moved on the next human push to main. Running again after Tidebot's
# own push run on main closes that gap; release-please is idempotent and
# no-ops when there is nothing to release.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tidebot]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update or publish release
    # Tidebot runs on main for pushes and for every comment on the default
    # branch; only the push run means main moved.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create the release draft for a merged release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          skip-github-pull-request: true
      # A draft has no tagCommit until publication. Release Please cannot
      # use it as a history boundary, and would count old commits again.
      - name: Check whether the current version is awaiting publication
        id: pending-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/$GH_REPO/contents/.release-please-manifest.json?ref=main" --jq .content | base64 --decode | jq -er '.["."]')
          pending=$(gh api "repos/$GH_REPO/releases" --paginate --slurp | jq -r --arg tag "v$version" 'any(.[][]; .draft and .tag_name == $tag)')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Update the next release pull request after publication
        if: steps.pending-release.outputs.pending == 'false'
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          skip-github-release: true
