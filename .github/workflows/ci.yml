name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    uses: fridthjof-labs/infra-kit/.github/workflows/workflow-ci.yml@fd1e6a54e4ae6ad303bbe023e00135b5d53ae2ce # shared CI standard

  checks:
    if: ${{ !cancelled() }}
    needs: [workflow-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require workflow validation
        env:
          POLICY_RESULT: ${{ needs.workflow-policy.result }}
        run: test "$POLICY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Check shell contracts
        run: |
          for file in scripts/*.sh; do sh -n "$file"; done
          ./scripts/test-artifacts.sh
          actionlint
